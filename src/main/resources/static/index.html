<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Bézier Curve Visualizer</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>

<body>
  <div class="container">
    <h1>Bézier Curve Visualizer</h1>
    <p>Click on the canvas to add control points, then click "Draw Curve".</p>

    <div class="canvas-container">
      <canvas id="canvas" width="800" height="600"></canvas>
      <div class="controls">
        <button id="drawButton">Draw Curve</button>
        <button id="clearButton">Clear</button>
      </div>
    </div>
    <div class="points-panel">
      <h3>Control Points</h3>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>X</th>
            <th>Y</th>
          </tr>
        </thead>
        <tbody id="pointsTable"></tbody>
      </table>
    </div>
  </div>
  <script src="./bezier.js"></script>
</body>

</html>
