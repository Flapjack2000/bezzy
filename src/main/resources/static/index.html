<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Bezzy | A Bézier curve visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
    <h1>Bezier Curve Visualizer</h1>
    <p>Click on the canvas to add control points, then click "Draw Curve"</p>

    <div class="canvas-container">
        <canvas id="canvas" width="800" height="600"></canvas>

        <div class="controls">
            <button id="drawButton">Draw Curve</button>
            <button id="clearButton">Clear</button>
        </div>
    </div>
</div>

<script src="bezier.js"></script>
</body>

</html>
